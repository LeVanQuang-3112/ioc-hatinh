services:
  lifedash-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lifedash-hatinh-web:latest
    container_name: lifedash-hatinh-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
